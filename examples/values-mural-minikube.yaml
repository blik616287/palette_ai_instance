# Mural day-1 values for minikube. Generated 2026-05-12 — secrets are
# stand-ins for a dev cluster. Rotate before sharing the cluster.
#
# Mirrors ansible/paletteai/roles/paletteai/templates/values.yaml.j2 with the
# domain pinned at <minikube-ip>.sslip.io so browsers + in-cluster Dex can
# both resolve the host.
global:
  dns:
    domain: '192.168.49.2.sslip.io'
  auth:
    sessionSecret: '0078984a45f66a6e75423b5c1298b48e99b7e5e12dbf5dbd48437433fdbb610e'
  auditLogging:
    basicAuth:
      username: 'audit-admin'
      password: '891fdbef0a6c85fa61876fceae808689'
  metrics:
    prometheusBaseUrl: 'https://192.168.49.2.sslip.io:30090'
    timeout: '5s'
    scrapeInterval: '15s'
    agentType: 'prometheus-agent-minimal'
    username: ''
    password: ''

canvas:
  ingress:
    enabled: true
    ingressClassName: nginx
    domain: '192.168.49.2.sslip.io'
    matchAllHosts: false
    paths:
      - path: /ai
        pathType: ImplementationSpecific
        backend:
          service:
            name: canvas
            port:
              number: 2999
  enableHTTP: true
  oidc:
    sessionSecret: '0078984a45f66a6e75423b5c1298b48e99b7e5e12dbf5dbd48437433fdbb610e'
    sessionDir: '/app/sessions'
    # Dex's TLS cert (auto-generated by the chart) has SANs for
    # `mural.mural-system.svc.*` — the helm release name — not for the
    # actual `dex` service. Node's fetch enforces hostname verification
    # even with skipSSLCertificateVerification=true, so any HTTPS call to
    # dex.mural-system.svc fails the TLS handshake before it reaches Dex
    # ("Invalid username or password" in canvas because fetch threw).
    # Going over plain HTTP on the in-cluster :5556 endpoint sidesteps
    # the cert mismatch and stays inside the cluster trust boundary.
    issuerK8sService: 'http://dex.mural-system.svc.cluster.local:5556/dex'
    skipSSLCertificateVerification: true
    redirectURL: 'https://192.168.49.2.sslip.io:31443/ai/callback'
  ui:
    oidc:
      sessionSecret: '0078984a45f66a6e75423b5c1298b48e99b7e5e12dbf5dbd48437433fdbb610e'
  impersonationProxy:
    enabled: true
    userMode: 'passthrough'
    # `map` (not `passthrough`) is required for dexGroupMap to take effect —
    # canvas's generateImpersonationHeaders only consults dexGroupMap when
    # groupsMode === "map" && user.isLocalUser. With passthrough the local
    # admin's JWT has no groups claim and canvas errors with
    # "No impersonation groups found for user". For SAML/external users you
    # want passthrough; for the bundled local admin only, use map.
    groupsMode: 'map'
    userMap: {}
    groupMap: {}
    dexGroupMap:
      'admin@paletteai.local':
        - 'admin'

dex:
  config:
    issuer: 'https://192.168.49.2.sslip.io:31443/dex'
    connectors: []
    staticClients:
      - id: mural
        redirectURIs:
          - 'https://192.168.49.2.sslip.io:31443/ai/callback'
        name: 'mural'
        secret: 'c3f90ed80b41a68a31a8f1560aa962438e137ecf2b4810dda04a80f89dc71658'
        public: false
        trustedPeers:
          - kubernetes
      - id: kubernetes
        redirectURIs:
          - 'https://192.168.49.2.sslip.io:31443'
        name: kubernetes
        secret: 'c3f90ed80b41a68a31a8f1560aa962438e137ecf2b4810dda04a80f89dc71658'
        public: false
        trustedPeers:
          - mural
    staticPasswords:
      - email: 'admin@paletteai.local'
        hash: '$2b$12$Sgxnan/ygeBTd6quuEh5s.zi/5RsUFM1SOBPU3jZoaTte1zcoDjjq'
        username: 'admin'
        userID: '08a8684b-db88-4b73-90a9-3cd1661f5466'
        # groups: [admin] places the user in the `admin` impersonation
        # group so canvas's impersonationProxy (groupsMode: passthrough)
        # has something to forward to the K8s API. Without this Dex's
        # local connector emits an empty groups claim and canvas errors
        # with "No impersonation groups found for user".
        groups:
          - admin
  ingress:
    enabled: true
    className: 'nginx'
    hosts:
      - host: '192.168.49.2.sslip.io'
        paths:
          - path: /dex
            pathType: ImplementationSpecific
    tls: []

alertmanager:
  livenessProbe:
    httpGet:
      path: /-/healthy
      port: http
      scheme: HTTPS
      httpHeaders:
        - name: Authorization
          value: "Basic YXVkaXQtYWRtaW46ODkxZmRiZWYwYTZjODVmYTYxODc2ZmNlYWU4MDg2ODk="
  readinessProbe:
    httpGet:
      path: /-/ready
      port: http
      scheme: HTTPS
      httpHeaders:
        - name: Authorization
          value: "Basic YXVkaXQtYWRtaW46ODkxZmRiZWYwYTZjODVmYTYxODc2ZmNlYWU4MDg2ODk="

flux2:
  policies:
    create: false

# The parent chart has its own dex Ingress under `dexIngress`, distinct from
# the dex subchart's `dex.ingress`. Both default to enabled and emit the same
# resource name in mural-system — the Go helm SDK treats that as a duplicate
# and errors out. Disable the parent one; the subchart Ingress is configured
# under dex.ingress above.
dexIngress:
  enabled: false

ingress-nginx:
  controller:
    service:
      type: NodePort
      nodePorts:
        http: "31080"
        https: "31443"
      annotations: {}
      # Production runs an external LB that terminates TLS and forwards
      # plain HTTP to the controller, so the upstream template maps both
      # ports to `http`. On minikube there's no LB — let ingress-nginx
      # terminate TLS itself with its built-in self-signed cert.
      targetPorts:
        http: http
        https: https
