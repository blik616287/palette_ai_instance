run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - errorlint
    - gocyclo
    - gofmt
    - goimports
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

linters-settings:
  gocyclo:
    min-complexity: 15
  goimports:
    local-prefixes: palette-ai-instance
  revive:
    rules:
      - name: exported
        severity: warning
      - name: package-comments
        severity: warning
      - name: var-naming
      - name: unused-parameter
        disabled: true

issues:
  exclude-rules:
    # Allow long lines + missing godoc on test files.
    - path: _test\.go
      linters:
        - revive
        - gosec
        - errcheck
        - unparam
        - gocyclo
  max-issues-per-linter: 0
  max-same-issues: 0
